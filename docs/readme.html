<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Full Guide — ApplyForge Docs</title>
  <meta name="description" content="Complete ApplyForge project guide: architecture, setup, configuration, and automation.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
    rel="stylesheet"
  >
  <link rel="stylesheet" href="./styles.css">
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css"
  >
  <style>
    .readme-body {
      max-width: 820px;
      margin: 0 auto;
    }

    .readme-body h1,
    .readme-body h2,
    .readme-body h3,
    .readme-body h4 {
      margin-top: 2em;
      margin-bottom: 0.5em;
      line-height: 1.2;
      max-width: 100%;
    }

    .readme-body h1 { font-size: clamp(2rem, 4vw, 3.2rem); margin-top: 0.4em; }
    .readme-body h2 { font-size: clamp(1.4rem, 2.5vw, 2rem); }
    .readme-body h3 { font-size: 1.2rem; }

    .readme-body p,
    .readme-body li {
      line-height: 1.75;
      color: var(--muted);
    }

    .readme-body a { color: var(--accent); text-decoration: underline; }

    .readme-body hr {
      border: none;
      border-top: 1px solid var(--line);
      margin: 2.4em 0;
    }

    .readme-body ul,
    .readme-body ol {
      padding-left: 1.5em;
    }

    .readme-body li + li { margin-top: 0.35em; }

    .readme-body blockquote {
      margin: 0;
      padding: 12px 18px;
      border-left: 3px solid var(--accent);
      background: var(--accent-soft);
      border-radius: 0 var(--radius-md) var(--radius-md) 0;
    }

    .readme-body blockquote p { margin: 0; color: var(--accent-strong); }

    .readme-body p code,
    .readme-body li code {
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.88em;
      padding: 2px 6px;
      border-radius: 5px;
      background: rgba(8, 76, 97, 0.08);
      color: var(--accent-strong);
    }

    .readme-body table {
      width: max-content;
      min-width: 100%;
      border-collapse: collapse;
      font-size: 0.95rem;
      margin: 0;
    }

    .readme-body th,
    .readme-body td {
      text-align: left;
      padding: 10px 14px;
      border-bottom: 1px solid var(--line);
      white-space: normal;
      word-break: break-word;
      overflow-wrap: anywhere;
    }

    .readme-body th {
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.78rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
      background: var(--bg-strong);
    }

    .readme-body img {
      max-width: 100%;
      border-radius: var(--radius-md);
      border: 1px solid var(--line);
      display: block;
      margin: 1.2em auto;
    }

    .readme-table-scroll {
      width: 100%;
      max-width: 100%;
      margin: 1.2em 0;
      overflow-x: auto;
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      background: rgba(255, 252, 246, 0.72);
    }

    .readme-code-block {
      position: relative;
      margin: 1.2em 0;
    }

    .readme-code-block pre {
      margin: 0;
      border-radius: var(--radius-md);
      overflow-x: auto;
    }

    .readme-code-block pre code {
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.88rem;
      line-height: 1.65;
      padding-right: 64px !important;
    }

    .readme-load-error {
      color: var(--warm);
      padding: 24px;
      background: rgba(196, 99, 47, 0.06);
      border-radius: var(--radius-md);
      border: 1px solid rgba(196, 99, 47, 0.2);
    }

    .readme-load-error a { color: var(--warm); }

    /* Prevent scroll behind search modal.
       Setting overflow on <html> avoids the iOS Safari bug where
       overflow:hidden on <body> breaks position:fixed elements. */
    html.search-open {
      overflow: hidden;
    }

    /* ── Search overlay ── */
    .search-overlay {
      position: fixed;
      inset: 0;
      z-index: 200;
      background: rgba(23, 20, 17, 0.45);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding-top: 80px;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.22s ease, visibility 0.22s ease;
    }

    .search-overlay.open {
      opacity: 1;
      visibility: visible;
    }

    .search-modal {
      width: min(calc(100vw - 32px), 640px);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      background: rgba(255, 250, 241, 0.98);
      backdrop-filter: blur(20px);
      box-shadow: 0 24px 64px rgba(23, 20, 17, 0.2);
      overflow: hidden;
      transform: translateY(-16px) scale(0.97);
      transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .search-overlay.open .search-modal {
      transform: translateY(0) scale(1);
    }

    .search-modal-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 16px 18px;
      border-bottom: 1px solid var(--line);
    }

    .search-modal-input {
      flex: 1;
      min-width: 0;
      border: none;
      background: transparent;
      font-family: "Space Grotesk", sans-serif;
      font-size: 1rem;
      color: var(--ink);
      outline: none;
    }

    .search-modal-input::placeholder { color: var(--muted); }

    .search-count-badge {
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.78rem;
      color: var(--muted);
      white-space: nowrap;
    }

    .search-modal-close {
      background: transparent;
      border: none;
      cursor: pointer;
      color: var(--muted);
      padding: 6px;
      display: flex;
      align-items: center;
      border-radius: 8px;
      transition: color 0.15s, background 0.15s;
      flex-shrink: 0;
    }

    .search-modal-close:hover {
      color: var(--ink);
      background: rgba(23, 20, 17, 0.07);
    }

    .search-modal-results {
      max-height: 360px;
      overflow-y: auto;
    }

    .search-modal-result-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: 12px 18px;
      cursor: pointer;
      border-bottom: 1px solid var(--line);
      transition: background 0.15s;
    }

    .search-modal-result-item:last-child { border-bottom: none; }
    .search-modal-result-item:hover { background: var(--accent-soft); }

    .search-modal-result-title {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--ink);
    }

    .search-modal-result-excerpt {
      font-size: 0.82rem;
      color: var(--muted);
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }

    .search-modal-no-results {
      padding: 14px 18px;
      font-size: 0.88rem;
      color: var(--muted);
      font-family: "IBM Plex Mono", monospace;
    }

    .search-modal-footer {
      padding: 10px 18px;
      border-top: 1px solid var(--line);
      display: flex;
      gap: 16px;
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.78rem;
      color: var(--muted);
    }

    .search-modal-footer kbd {
      display: inline-flex;
      align-items: center;
      padding: 2px 6px;
      border: 1px solid var(--line);
      border-radius: 5px;
      background: var(--bg-strong);
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.7rem;
      color: var(--ink);
      margin-right: 4px;
    }

    mark {
      background: rgba(12, 124, 89, 0.18);
      color: inherit;
      border-radius: 2px;
      padding: 0 1px;
    }

    #readme-content h1,
    #readme-content h2,
    #readme-content h3,
    #readme-content h4 {
      scroll-margin-top: 96px;
    }
  </style>
</head>
<body>
  <div class="page-shell">
    <header></header>

    <main>
      <section class="section" style="padding-top: 28px;">
        <!-- Version / latest release banner -->
        <div class="whats-new-banner reveal" style="margin-bottom: 28px; max-width: 820px; margin-left: auto; margin-right: auto;">
          <span class="whats-new-badge">v1.14.0</span>
          <p class="whats-new-text">
            <strong>Latest:</strong>
            <code>navbar.js</code> global docs topbar · Searchable full guide in <code>readme.html</code> ·
            Mobile topbar overflow fix · README/docs refresh for v1.14.0
            &nbsp;—&nbsp;
            <a href="https://github.com/FahimFBA/applyforge/blob/main/CHANGELOG.md" target="_blank" rel="noopener noreferrer" style="color: var(--accent-strong); text-decoration: underline;">Full changelog ↗</a>
          </p>
        </div>

        <div class="readme-body reveal" id="readme-content" style="transition-delay: 0.1s;">
          <p style="color: var(--muted);">Loading guide…</p>
        </div>
      </section>
    </main>

    <footer class="site-footer" aria-label="Site footer">
      <div class="footer-left">
        <span class="footer-brand">ApplyForge</span>
        <div class="footer-links">
          <a href="https://github.com/FahimFBA/applyforge" target="_blank" rel="noopener noreferrer">GitHub</a>
          <a href="index.html">Docs Home</a>
          <a href="https://github.com/FahimFBA/applyforge/blob/main/CHANGELOG.md" target="_blank" rel="noopener noreferrer">Changelog</a>
          <a href="https://github.com/FahimFBA/applyforge/issues" target="_blank" rel="noopener noreferrer">Issues</a>
        </div>
      </div>
      <span class="version-badge">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
        v1.14.0
      </span>
    </footer>
  </div>

  <!-- Search overlay -->
  <div class="search-overlay" id="search-overlay" role="dialog" aria-modal="true" aria-label="Search the full guide">
    <div class="search-modal">
      <div class="search-modal-header">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color:var(--muted);flex-shrink:0"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="search" id="readme-search" class="search-modal-input" placeholder="Search the full guide…" autocomplete="off" spellcheck="false" aria-label="Search guide content">
        <span id="readme-search-count" class="search-count-badge" hidden></span>
        <button id="search-close" class="search-modal-close" aria-label="Close search">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div id="readme-search-results" class="search-modal-results"></div>
      <div class="search-modal-footer">
        <span><kbd>↵</kbd> jump to section</span>
        <span><kbd>Esc</kbd> close</span>
      </div>
    </div>
  </div>

  <script src="./navbar.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mark.js/8.11.1/mark.min.js"></script>
  <script>
    const repoBlobBase = "https://github.com/FahimFBA/applyforge/blob/main/";

    function slugifyHeading(text) {
      return text
        .toLowerCase()
        .replace(/[^\w\s-]/g, "")
        .trim()
        .replace(/\s+/g, "-");
    }

    function rewriteRepoLinks(container) {
      container.querySelectorAll("a[href]").forEach((link) => {
        const href = link.getAttribute("href");
        if (!href || href.startsWith("#") || /^[a-z]+:/i.test(href)) return;

        link.href = new URL(href, repoBlobBase).toString();
        link.target = "_blank";
        link.rel = "noreferrer";
      });
    }

    async function loadReadme() {
      const el = document.getElementById("readme-content");
      try {
        let res = await fetch("./README.md");
        if (!res.ok) res = await fetch("../README.md");
        if (!res.ok) throw new Error(`HTTP ${res.status} — README.md not found`);
        const md = await res.text();

        el.innerHTML = marked.parse(md);

        el.querySelectorAll("h1, h2, h3, h4, h5, h6").forEach((heading) => {
          const id = slugifyHeading(heading.textContent || "");
          if (id) heading.id = id;
        });

        rewriteRepoLinks(el);

        el.querySelectorAll("img").forEach((img) => {
          img.src = img.getAttribute("src").replace(/^docs\//, "./");
        });

        el.querySelectorAll("pre code").forEach((block) => {
          hljs.highlightElement(block);

          const pre = block.parentElement;
          const wrapper = document.createElement("div");
          wrapper.className = "readme-code-block";
          pre.parentNode.insertBefore(wrapper, pre);
          wrapper.appendChild(pre);

          const btn = document.createElement("button");
          btn.className = "copy-btn";
          btn.textContent = "Copy";
          btn.addEventListener("click", () => {
            navigator.clipboard.writeText(block.textContent).then(() => {
              btn.textContent = "Copied!";
              btn.classList.add("copied");
              setTimeout(() => {
                btn.textContent = "Copy";
                btn.classList.remove("copied");
              }, 2000);
            });
          });
          wrapper.appendChild(btn);
        });

        el.querySelectorAll("table").forEach((table) => {
          const wrapper = document.createElement("div");
          wrapper.className = "readme-table-scroll";
          table.parentNode.insertBefore(wrapper, table);
          wrapper.appendChild(table);
        });

        initSearch();
      } catch (err) {
        el.innerHTML = `<p class="readme-load-error">Could not load guide (${err.message}). <a href="https://github.com/FahimFBA/applyforge/blob/main/README.md">View on GitHub</a></p>`;
      }
    }

    function initSearch() {
      const trigger = document.getElementById("search-trigger");
      const overlay = document.getElementById("search-overlay");
      const closeBtn = document.getElementById("search-close");
      const input = document.getElementById("readme-search");
      const countEl = document.getElementById("readme-search-count");
      const resultsEl = document.getElementById("readme-search-results");
      const content = document.getElementById("readme-content");

      if (!trigger || !overlay || !input || !content || typeof Mark === "undefined") return;

      const markInstance = new Mark(content);
      let searchIndex = [];

      function openSearch() {
        overlay.classList.add("open");
        document.documentElement.classList.add("search-open");
        requestAnimationFrame(() => input.focus());
      }

      function closeSearch() {
        overlay.classList.remove("open");
        document.documentElement.classList.remove("search-open");
      }

      function clearSearch() {
        input.value = "";
        markInstance.unmark();
        countEl.hidden = true;
        resultsEl.innerHTML = "";
      }

      trigger.addEventListener("click", openSearch);

      closeBtn.addEventListener("click", () => {
        clearSearch();
        closeSearch();
      });

      overlay.addEventListener("click", (e) => {
        if (e.target === overlay) closeSearch();
      });

      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && overlay.classList.contains("open")) {
          closeSearch();
        }
        if ((e.metaKey || e.ctrlKey) && e.key === "k") {
          e.preventDefault();
          openSearch();
        }
      });

      function buildIndex() {
        const index = [];
        content.querySelectorAll("h1, h2, h3, h4").forEach((heading) => {
          const excerptParts = [];
          let sibling = heading.nextElementSibling;
          while (sibling && !["H1", "H2", "H3", "H4"].includes(sibling.tagName)) {
            excerptParts.push(sibling.textContent || "");
            sibling = sibling.nextElementSibling;
          }
          index.push({
            id: heading.id,
            title: heading.textContent.trim(),
            excerpt: excerptParts.join(" ").trim().slice(0, 200),
          });
        });
        return index;
      }

      function doSearch(query) {
        markInstance.unmark();
        resultsEl.innerHTML = "";
        countEl.hidden = true;

        if (!query || query.length < 2) return;

        markInstance.mark(query, {
          separateWordSearch: false,
          done(count) {
            countEl.textContent = `${count} match${count !== 1 ? "es" : ""}`;
            countEl.hidden = false;
          },
        });

        const q = query.toLowerCase();
        const matches = searchIndex.filter(
          (item) =>
            item.title.toLowerCase().includes(q) ||
            item.excerpt.toLowerCase().includes(q)
        );

        if (matches.length) {
          matches.slice(0, 8).forEach((item) => {
            const div = document.createElement("div");
            div.className = "search-modal-result-item";
            div.innerHTML = `
              <span class="search-modal-result-title">${item.title}</span>
              <span class="search-modal-result-excerpt">${item.excerpt || "—"}</span>
            `;
            div.addEventListener("click", () => {
              const target = item.id ? document.getElementById(item.id) : null;
              closeSearch();
              if (target) {
                setTimeout(() => target.scrollIntoView({ behavior: "smooth", block: "start" }), 180);
              }
            });
            resultsEl.appendChild(div);
          });
        } else {
          resultsEl.innerHTML = `<p class="search-modal-no-results">No results for "${query}"</p>`;
        }
      }

      input.addEventListener("input", () => {
        if (!searchIndex.length) searchIndex = buildIndex();
        doSearch(input.value.trim());
      });
    }

    loadReadme();

    // Scroll reveal for banner, search bar, and content
    function initReveal() {
      if (!("IntersectionObserver" in window)) {
        document.querySelectorAll(".reveal").forEach((el) => el.classList.add("visible"));
        return;
      }
      const obs = new IntersectionObserver(
        (entries) => {
          entries.forEach((e) => {
            if (e.isIntersecting) { e.target.classList.add("visible"); obs.unobserve(e.target); }
          });
        },
        { threshold: 0.08 }
      );
      document.querySelectorAll(".reveal").forEach((el) => obs.observe(el));
    }

    initReveal();
  </script>
</body>
</html>
