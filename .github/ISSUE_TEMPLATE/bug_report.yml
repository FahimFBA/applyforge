name: Bug report
description: Report a reproducible problem in ApplyForge
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please provide enough detail for reproduction.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect instead?
      placeholder: A clear description of the bug and the expected behavior.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the exact steps, inputs, or spreadsheet state needed to trigger the issue.
      placeholder: |
        1. Configure ...
        2. Run ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or traceback
      description: Paste relevant logs, traceback, or workflow output. Remove secrets first.
      render: shell
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Share the environment details relevant to the bug.
      placeholder: |
        - OS:
        - Python version:
        - Run mode: local / Docker / GitHub Actions
        - Relevant providers: OpenAI / Google Sheets / Google Drive
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: I removed or redacted secrets, tokens, keys, and personal data from logs.
          required: true
        - label: I can reproduce this on the latest `main` branch or latest release.
          required: true
